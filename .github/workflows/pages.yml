name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Публикуем только то, что нужно игре: без docs/, scripts/, исходников спрайтов и агентских файлов
      - name: Assemble site
        run: |
          mkdir -p _site/js _site/assets
          cp index.html style.css game.js _site/
          cp js/*.js _site/js/
          for f in $(grep -ohE "assets/[A-Za-z0-9._-]+\.(png|svg)" index.html style.css game.js js/*.js | sort -u); do
            cp "$f" "_site/$f"
          done
          ls -R _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
